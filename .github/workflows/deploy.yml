# 部署到Cloudflare Pages的工作流
name: Deploy to Cloudflare Pages

# 触发条件：推送到main分支或手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # 运行环境
    runs-on: ubuntu-latest
    # 权限设置
    permissions:
      contents: read
      deployments: write
    # 任务名称
    name: Deploy to Cloudflare Pages
    # 步骤
    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 部署到Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          projectName: eada  # 项目名称
          directory: .       # 部署目录
          branch: main       # 部署分支
